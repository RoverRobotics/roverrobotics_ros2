roverrobotics_driver:
  ros__parameters:
    diagnostics_frequency: 0.2
    odometry_frequency: 15.0
    pose_linear_covariance: 0.1   # x/y uncertainty of the dead-reckoned pose
    pose_yaw_covariance: 0.5      # yaw uncertainty of the dead-reckoned pose
    motor_control_p_gain: 0.0011
    motor_control_i_gain: 0.000
    motor_control_d_gain: 0.00008
    publish_tf: false
    # robot_status_topic: "/"
    # robot_status_frequency: 60.0
    # robot_info_request_topic:
    # robot_info_topic:
    robot_type: "zero2"
    serial_number: ""            # unit serial; any text. Published latched on rover_<type>/serial_number
    device_port: "/dev/rover-control"
    comm_type: "serial"
    speed_topic: "/cmd_vel"
    max_velocity_step: 0.75       # max reduction in linear velocity per 50 ms cycle
    cmd_vel_timeout_sec: 0.3      # stop if no new twist for >300 ms
    # estop_trigger_topic:
    # estop_reset_topic:
    # trim_topic:
    # estop_state:
    control_mode: "INDEPENDENT_WHEEL" # Closed loop : INDEPENDENT_WHEEL | Open loop : OPEN_LOOP
    # linear_top_speed:
    # angular_top_speed:
    odom_topic: "/odometry/wheels"
    odom_frame_id: "odom"
    odom_child_frame_id: "base_link" # Set this to the base frame of the robot
    # angular_a_coef:
    # angular_b_coef:
    # angular_c_coef:
    # angular_min_scale:
    # angular_max_scale:

joint_state_publisher:
  ros__parameters:
    publish_default_positions: true
    rate: 30
