roverrobotics_driver:
  ros__parameters:
    # Robot Parameters
    drivetrain: "differential"   # differential, mecanum
    robot_type: "max"
    serial_number: ""            # unit serial; any text. Published latched on rover_<type>/serial_number
    comm_type: "can"
    device_port: "rovercan" # "rovercan" for differential/mecanum | "internal" for differential/mecanum with blue-ox board

    # Robot Kinematics
    wheel_radius: 0.155  # effective rolling radius of the 13 Inch wheels (nominal 0.1651), measured 2026-09-29
    wheel_base: 0.90     # effective skid-steer track (geometric 0.4953), measured 2026-09-29
    robot_length: 0.4445   # Distance between wheels front-to-back from center of the wheel (meters)
    gear_ratio: 5.0
    motor_pole_pairs: 10.0     # 20-pole motor; VESC reports eRPM, mech RPM = eRPM / pole pairs

    # Battery (voltage-derived SOC + charging status)
    battery_cells: 10
    battery_voltage_multiplier: 1.0    # Adjust if VESC voltage reading is off
    battery_max_cell_voltage: 4.2      # Fully charged cell voltage
    battery_min_cell_voltage: 3.4      # Empty cell voltage
    max_velocity_step: 0.75       # max reduction in linear velocity per 50 ms cycle
    rest_wheel_rpm: 8.0        # below this wheel rpm a stopped wheel is released
    brake_band_duty: 0.20      # 0.0 = off; max duty below the speed-holding duty while braking (0.20 = firm stop)
    brake_band_rpm: 160.0      # above this wheel rpm the band shrinks as 1/rpm
    brake_momentum_carry: true # a wheel still speeding up just after a stop stays on the band (not taken for a hill)
    rpm_per_duty: 325.0        # wheel rpm per unit duty; keep within 320.0-335.0
    release_hold_s: 0.0        # SET_DUTY 0 hold after the wheels read 0
    cmd_vel_timeout_sec: 0.3      # stop if no new twist for >300 ms
    wheel_trim_fl: 1.0
    wheel_trim_fr: 1.0
    wheel_trim_rl: 1.0 #0.99   # example: slow wheel
    wheel_trim_rr: 1.0 #0.9686   # example: fast new motor

    # PID for wheel controllers and limits
    motor_control_p_gain: 0.0005     # gains tuned with feedforward on
    motor_control_i_gain: 0.00000
    motor_control_d_gain: 0.000025
    ff_rpm_per_duty: 322.0           # feedforward: wheel rpm per unit duty, 0 = feedforward off
    ff_static_duty: 0.021            # duty to overcome friction at any nonzero speed
    ff_turn_duty: 0.0                # extra breakaway duty on a pivot, 0 = off
    ff_calibration_voltage: 40.3     # bus voltage the feedforward was measured at, 0 = no compensation
    ff_correction_decay: 1.0         # per-cycle decay of the PID correction, 0 = standard decay, 1.0 = none
    ff_correction_release: true      # PID clears a stale correction at once (wheel reversing, or after a turn)
    max_linear_acceleration: 1.5     # m/s^2 while speeding up only, 0 = built-in limit; stops are unaffected
    max_angular_acceleration: 4.0    # rad/s^2 while a turn builds up only, 0 = built-in limit
    low_speed_trust_rpm: 2.0         # below this wheel rpm the PID is scaled down and feedforward leads
    #linear_top_speed: 3.0 # Meters-per-second
    #angular_top_speed: 3.0 # Radians-per-second
    #angular_a_coef: 0.8
    #angular_b_coef: 1.0
    #angular_c_coef: 1.0
    #angular_min_scale: 1.0
    #angular_max_scale: 1.5
    
    # Diagnostics and Status
    diagnostics_frequency: 0.2
    odometry_frequency: 15.0
    pose_linear_covariance: 0.1   # x/y uncertainty of the dead-reckoned pose
    pose_yaw_covariance: 0.5      # yaw uncertainty of the dead-reckoned pose
    # robot_status_topic: "/"
    # robot_status_frequency: 60.0
    # robot_info_request_topic:
    # robot_info_topic:
    
    # Topics and Frames
    speed_topic: "/cmd_vel"
    odom_topic: "/odometry/wheels"
    odom_frame_id: "odom"
    odom_child_frame_id: "base_link" # Set this to the base frame of the robot
    publish_tf: false # publish transform from odom frame to odom child frame
    estop_trigger_topic: "/soft_estop/trigger"   # Bool true = stop (PS4/PS5 Circle)
    estop_reset_topic: "/soft_estop/reset"       # Bool true = release (PS4/PS5 Triangle)
    estop_status_topic: "/soft_estop/status"     # latched Bool, true while stopped
    estop_state: false                           # true = start up already stopped

# PS4/PS5 pad limits for max_teleop.launch.py
joy_manager:
  ros__parameters:
    start_lin_throttle: 1.0     # full stick = 1.0 x 1.25 = 1.25 m/s
    lin_increment: 0.25         # D-pad up/down: +/-0.3125 m/s per press
    max_lin_speed: 1.875        # forward/back ceiling, m/s
    start_ang_throttle: 0.5     # full stick = 0.5 x 2.5 = 1.25 rad/s
    ang_increment: 0.125        # D-pad left/right: +/-0.3125 rad/s per press
    max_ang_speed: 1.875        # turn ceiling, rad/s
